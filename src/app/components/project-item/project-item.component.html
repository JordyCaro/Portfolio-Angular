<a class="project" [routerLink]="'/project/' + project.id" [attr.aria-label]="('projects.view' | t) + ': ' + project.name" (mousemove)="onMove($event)">
  <div class="project__media">
    <img [src]="project.coverImage" [alt]="project.name" loading="lazy">
    <div class="gradient"></div>
    <span class="project__index" *ngIf="index !== null">{{ (index + 1).toString().padStart(2, '0') }}</span>
  </div>

  <div class="project__body">
    <div class="project__heading">
      <strong>{{ project.name }}</strong>
      <span class="project__arrow" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
      </span>
    </div>

    <div class="project__techs">
      <span *ngFor="let tech of techs">{{ tech }}</span>
    </div>
  </div>
</a>
